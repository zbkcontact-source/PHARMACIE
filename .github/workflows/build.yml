name: Build PHARMACIE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configurer (Mac universel Intel + Apple Silicon)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      - name: Signer et créer l'installeur .pkg
        run: |
          A=build/Pharmacie_artefacts/Release
          codesign --force --deep -s - "$A/VST3/PHARMACIE.vst3"
          codesign --force --deep -s - "$A/AU/PHARMACIE.component"
          mkdir -p root/vst3 root/au
          cp -R "$A/VST3/PHARMACIE.vst3" root/vst3/
          cp -R "$A/AU/PHARMACIE.component" root/au/
          for f in vst3 au; do
            pkgbuild --analyze --root root/$f $f.plist
            plutil -replace 0.BundleIsRelocatable -bool NO $f.plist
          done
          pkgbuild --root root/vst3 --component-plist vst3.plist --identifier com.mary.pharmacie.vst3 --version 1.0.0 --install-location /Library/Audio/Plug-Ins/VST3 vst3.pkg
          pkgbuild --root root/au --component-plist au.plist --identifier com.mary.pharmacie.au --version 1.0.0 --install-location /Library/Audio/Plug-Ins/Components au.pkg
          productbuild --package vst3.pkg --package au.pkg PHARMACIE-Mac.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: PHARMACIE-Mac
          path: PHARMACIE-Mac.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer
        run: cmake -B build -A x64

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      - name: Zipper le VST3
        shell: pwsh
        run: Compress-Archive -Path "build/Pharmacie_artefacts/Release/VST3/PHARMACIE.vst3" -DestinationPath PHARMACIE-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PHARMACIE-Windows
          path: PHARMACIE-Windows-VST3.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publier la release (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PHARMACIE v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Mac** : télécharge `PHARMACIE-Mac.pkg`, clic droit > Ouvrir, puis installe (VST3 + AU).
            **Windows** : dézippe `PHARMACIE-Windows-VST3.zip` dans `C:\Program Files\Common Files\VST3`.
            Dans Ableton : Réglages > Plug-ins > Rescan, puis cherche PHARMACIE dans Plug-ins.
          files: dist/*
